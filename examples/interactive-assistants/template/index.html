<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Learning activity card</title>
    <link rel="stylesheet" href="card.css">
  </head>
  <body>
    <main>
      <p id="objective" class="eyebrow"></p>
      <h2 id="prompt">Waiting for the activity…</h2>
      <p id="hint" hidden></p>
      <div id="interaction"></div>
      <p id="feedback" role="status" aria-live="polite"></p>
      <section id="completion" tabindex="-1" hidden>
        <h2>Activity complete</h2>
        <p>There are no more questions in this activity.</p>
      </section>
    </main>
    <script type="module" src="card.js"></script>
  </body>
</html>
