<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutor activity host</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Current learning activity</p>
        <h1 id="activity-title">Interaction card</h1>
        <p id="activity-goal">Choose an answer, inspect feedback, and stop whenever you want.</p>
      </header>
      <nav aria-label="Activity controls">
        <button id="start" type="button">Start</button>
        <button id="pause" type="button" disabled>Pause</button>
        <button id="stop" type="button" disabled>Stop</button>
      </nav>
      <p id="status" role="status" aria-live="polite">Ready to start.</p>
      <iframe
        id="assistant"
        title="Interactive learning activity"
        sandbox="allow-scripts"
        referrerpolicy="no-referrer"
        hidden
      ></iframe>
    </main>
    <script type="module" src="/host-app.js"></script>
  </body>
</html>
