<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mental estimate card</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <section id="intro" class="stage" tabindex="-1" aria-labelledby="prompt">
        <h2 id="prompt">Waiting for the estimateâ€¦</h2>
        <button id="continue" type="button">Continue</button>
      </section>
      <section id="question" class="stage" tabindex="-1" aria-labelledby="question-prompt" hidden>
        <h2 id="question-prompt"></h2>
        <div id="response"><label>Your estimate <input required autocomplete="off"></label><button id="check" type="button">Check</button></div>
        <div id="help-actions"><button id="help" type="button">Help</button></div>
      </section>
      <section id="guidance" class="stage" tabindex="-1" aria-labelledby="guidance-title" hidden>
        <h2 id="guidance-title">Let's try that again</h2>
        <p id="feedback" role="status" aria-live="polite"></p>
        <p id="hint"></p>
        <button id="retry" type="button">Continue</button>
      </section>
      <section id="completion" class="stage" tabindex="-1" aria-labelledby="completion-title" hidden>
        <h2 id="completion-title">Activity complete</h2>
        <p id="completion-message">There are no more questions in this activity.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
